name: Engine drift

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      dalfox:
        description: dalfox version to test (latest, or e.g. 2.9.2)
        default: latest

permissions:
  contents: write
  actions: write
  issues: write

jobs:
  drift:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      WANT: ${{ inputs.dalfox || 'latest' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install dalfox
        run: |
          module=$(jq -r .dalfox.go engines.json)
          v=$WANT
          case $v in latest) ;; v*) ;; *) v=v$v ;; esac
          go install "$module@$v"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Installed versions
        id: versions
        run: |
          installed=$(dalfox version 2>&1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          tested=$(jq -r .dalfox.version engines.json)
          echo "dalfox installed $installed, tested $tested"
          echo "installed=$installed" >> "$GITHUB_OUTPUT"
          echo "tested=$tested" >> "$GITHUB_OUTPUT"
      - run: pip install tiktoken
      - name: Live benchmark
        run: |
          set -o pipefail
          W=$RUNNER_TEMP/bench
          status=0
          LIVE=1 PY=python3 bench/run.sh "$W" 2>&1 | tee "$RUNNER_TEMP/bench.log" || status=$?
          grep -h engine_format "$W"/*.live.json >> "$RUNNER_TEMP/bench.log" && status=1
          grep -E 'missing from output|MISSING|COUNT|engine_format' "$RUNNER_TEMP/bench.log" > "$RUNNER_TEMP/verify.txt" || true
          exit $status
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-bench
          path: |
            ${{ runner.temp }}/bench
            ${{ runner.temp }}/bench.log
            bench/fixtures
          retention-days: 14
      - name: Commit the bump and release
        env:
          INSTALLED: ${{ steps.versions.outputs.installed }}
          TESTED: ${{ steps.versions.outputs.tested }}
        run: |
          newest=$(printf '%s\n%s\n' "$TESTED" "$INSTALLED" | sort -V | tail -1)
          if [ -z "$INSTALLED" ] || [ "$INSTALLED" = "$TESTED" ] || [ "$newest" != "$INSTALLED" ]; then
            echo "dalfox $INSTALLED is not newer than the tested $TESTED; nothing to bump"
            exit 0
          fi
          # only engines.json: the refreshed fixtures are in the live-bench artifact, not in the commit
          git checkout -- bench/fixtures
          jq --arg v "$INSTALLED" '.dalfox.version = $v' engines.json > engines.json.new
          mv engines.json.new engines.json
          go test ./...
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add engines.json
          git commit -m "Test with dalfox $INSTALLED"
          git push origin HEAD:${{ github.event.repository.default_branch }}
          # a push made with GITHUB_TOKEN does not trigger release.yml, so tag here
          .github/release.sh patch
      - name: Open or update the drift issue
        if: failure()
        env:
          INSTALLED: ${{ steps.versions.outputs.installed }}
        run: |
          gh label create engine-drift --color B60205 --description "An engine update broke raijin-xss" 2>/dev/null || true
          {
            echo "The live benchmark or go test failed with dalfox $INSTALLED (tested: $(jq -r .dalfox.version engines.json))."
            echo
            echo '```'
            cat "$RUNNER_TEMP/verify.txt" 2>/dev/null || echo "no verify output; see the run log"
            echo '```'
            echo
            echo "Run: $RUN_URL"
          } > "$RUNNER_TEMP/issue.md"
          open=$(gh issue list --label engine-drift --state open --json number --jq '.[0].number')
          if [ -n "$open" ]; then
            gh issue comment "$open" --body-file "$RUNNER_TEMP/issue.md"
          else
            gh issue create --title "Engine drift: dalfox $INSTALLED" --label engine-drift --body-file "$RUNNER_TEMP/issue.md"
          fi
      - name: Close the drift issue
        env:
          INSTALLED: ${{ steps.versions.outputs.installed }}
        run: |
          for n in $(gh issue list --label engine-drift --state open --json number --jq '.[].number'); do
            gh issue close "$n" --comment "Passes with dalfox $INSTALLED: $RUN_URL"
          done
