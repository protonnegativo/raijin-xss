name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: which part of the version to bump
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tag and release
        env:
          BUMP: ${{ inputs.bump || 'patch' }}
          # a manual run releases whatever is on HEAD; a push skips docs-only changes
          BASE: ${{ github.event_name == 'push' && github.event.before || '' }}
        run: .github/release.sh "$BUMP" "$BASE"
