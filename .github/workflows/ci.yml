name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: test -z "$(gofmt -l .)"
      - run: go test ./...
      - run: pip install tiktoken
      # offline replay of bench/fixtures: bench/run.sh exits non-zero when verify reports a missing PoC
      - name: Benchmark replay
        run: |
          PY=python3 bench/run.sh "$RUNNER_TEMP/bench" | tee "$RUNNER_TEMP/bench.log"
          ! grep -E '[1-9][0-9]* missing from output' "$RUNNER_TEMP/bench.log"
